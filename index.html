<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Famiphoto"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#fafafa"/>
<title>Famiphoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap" rel="stylesheet"/>
<link rel="icon" href="./rose-two.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="./icons/rose-two-180.png"/>
<link rel="manifest" href="./manifest.webmanifest?v=33"/>
<link rel="stylesheet" href="./vendor/photoswipe/photoswipe.css"/>
<link rel="stylesheet" href="./app.css?v=47"/>
<script src="./config.js?v=1787366995"></script>
<script>
(function () {
  var stored = "";
  try { stored = localStorage.getItem("family.viewKey") || ""; } catch (e) {}
  var q = new URLSearchParams(location.search).get("k") || "";
  window.FAMILY_URL_KEY = /^[A-Za-z0-9_-]{8,128}$/.test(q) ? q : "";
  window.FAMILY_VIEW_KEY = stored;
  window.FAMILY_SKIP_BOOT = true;
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="blobs" id="blobs" hidden aria-hidden="true">
  <span></span><span></span><span></span><span></span>
</div>
<div class="hall with-feed" id="hall">
  <div class="profile">
    <div class="rose-two" id="rose-two"></div>
    <h1 class="brand">Famiphoto</h1>
    <p class="credit">since 2026 from 章晨風</p>
    <p class="status" id="status">正在問備份硬碟…</p>
  </div>
  <div class="invite-panel" id="invite-panel" hidden>
    <p class="invite-hey" id="invite-hey">Hey! 開始備份你的照片</p>
    <p class="invite-safari" id="invite-safari" hidden>請用 Safari 打開</p>
    <button type="button" class="invite-go" id="invite-go">開始備份</button>
    <form id="invite-auth" hidden>
      <p class="err" id="invite-auth-err"></p>
      <label for="invite-apple">Apple ID</label>
      <input id="invite-apple" type="email" autocomplete="username" required/>
      <label for="invite-pass">密碼</label>
      <input id="invite-pass" type="password" autocomplete="current-password" required/>
      <button type="submit">下一步</button>
    </form>
    <form id="invite-mfa" hidden>
      <p class="meta">請輸入手機上的 6 位數</p>
      <p class="err" id="invite-mfa-err"></p>
      <label for="invite-code">驗證碼</label>
      <input id="invite-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required/>
      <button type="submit">送出</button>
    </form>
    <div id="invite-install" hidden>
      <p class="invite-hey">請點底部分享，再選加入主畫面</p>
      <button type="button" class="invite-go" id="invite-installed">完成</button>
    </div>
  </div>
  <div class="local-cabs">
    <div class="grid" id="cabinets"></div>
  </div>
  <div class="tag-board" id="tag-board" hidden></div>
  <div id="album" hidden>
    <div class="wrap album-bar" style="padding-top:8px">
      <a class="back" href="#">← 全部櫃子</a>
      <div class="album-head">
        <h2 id="album-title"></h2>
        <button type="button" class="cover-change" id="album-cover-btn" aria-label="更換封面" title="更換封面"></button>
      </div>
    </div>
    <div class="feed" id="feed"></div>
    <p class="feed-hint" id="feed-hint" hidden>讀取照片中…</p>
    <div class="feed-sentinel" id="feed-sentinel" hidden></div>
  </div>
</div>
<aside class="photo-rail" id="photo-rail" hidden aria-label="照片操作"></aside>
<script src="./vendor/photoswipe/photoswipe.umd.min.js"></script>
<script src="./vendor/photoswipe/photoswipe-lightbox.umd.min.js"></script>
<script src="./rose-two.js?v=22"></script>
<script src="./gallery.js?v=43"></script>
<script src="./tags.js?v=42"></script>
<script src="./gate.js?v=2"></script>
<script src="./door.js?v=44"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js?v=44");
}
</script>
</body>
</html>
