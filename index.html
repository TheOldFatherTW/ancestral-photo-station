<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#fafafa"/>
<title>家族照片備份</title>
<link rel="icon" href="./rose-two.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="./icons/rose-two-180.png"/>
<link rel="manifest" href="./manifest.webmanifest?v=13"/>
<link rel="stylesheet" href="./vendor/photoswipe/photoswipe.css"/>
<link rel="stylesheet" href="./app.css?v=13"/>
<script src="./config.js"></script>
</head>
<body>
<div class="hall with-feed" style="padding:32px 16px 8px">
  <div class="profile">
    <div class="rose-two" id="rose-two"></div>
    <h1>家族照片備份</h1>
    <p class="credit">since 2026 from 章晨風</p>
    <p class="status" id="status">正在問備份硬碟…</p>
  </div>
  <div class="local-cabs">
    <div class="grid" id="cabinets"></div>
  </div>
  <div id="album" hidden>
    <div class="wrap album-bar" style="padding-top:8px">
      <a class="back" href="#">← 全部櫃子</a>
      <div class="album-head">
        <h2 id="album-title"></h2>
        <button type="button" class="cover-change" id="album-cover-btn" aria-label="更換封面" title="更換封面"></button>
      </div>
    </div>
    <div class="feed" id="feed"></div>
    <p class="feed-hint" id="feed-hint" hidden>讀取照片中…</p>
    <div class="feed-sentinel" id="feed-sentinel" hidden></div>
  </div>
</div>
<script src="./vendor/photoswipe/photoswipe.umd.min.js"></script>
<script src="./vendor/photoswipe/photoswipe-lightbox.umd.min.js"></script>
<script src="./rose-two.js?v=13"></script>
<script src="./gallery.js?v=13"></script>
<script src="./door.js?v=13"></script>
</body>
</html>
